<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-label="Aurora — decentralized music streaming">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b16"/>
      <stop offset="55%" stop-color="#120a22"/>
      <stop offset="100%" stop-color="#06080f"/>
    </linearGradient>
    <radialGradient id="aur1" cx="20%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="85%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur3" cx="65%" cy="95%" r="80%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="45%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#aur1)"/>
  <rect width="1280" height="420" fill="url(#aur2)"/>
  <rect width="1280" height="420" fill="url(#aur3)"/>

  <!-- vinyl disc -->
  <g transform="translate(1050,210)" opacity="0.92">
    <circle r="128" fill="#0e0e1a" stroke="#2a2a44" stroke-width="2"/>
    <circle r="128" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle r="104" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <circle r="80" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <circle r="56" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <circle r="40" fill="url(#title)"/>
    <circle r="8" fill="#0e0e1a"/>
  </g>

  <!-- title -->
  <text x="96" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="2" fill="url(#title)">Aurora</text>
  <text x="100" y="226" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#c7c9e0">Decentralized music, owned by the people who make it.</text>

  <!-- web3 pill -->
  <g transform="translate(100,256)">
    <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="17" r="5" fill="#22d3ee"/>
    <text x="40" y="23" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6e7f5">Web3 · IPFS</text>
  </g>
  <g transform="translate(262,256)">
    <rect width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="17" r="5" fill="#f0abfc"/>
    <text x="40" y="23" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6e7f5">Wallet sign-in</text>
  </g>

  <!-- equalizer bars -->
  <g transform="translate(100,330)">
    <rect x="0"   y="34" width="10" height="36" rx="5" fill="url(#bars)"/>
    <rect x="18"  y="14" width="10" height="56" rx="5" fill="url(#bars)"/>
    <rect x="36"  y="44" width="10" height="26" rx="5" fill="url(#bars)"/>
    <rect x="54"  y="0"  width="10" height="70" rx="5" fill="url(#bars)"/>
    <rect x="72"  y="26" width="10" height="44" rx="5" fill="url(#bars)"/>
    <rect x="90"  y="48" width="10" height="22" rx="5" fill="url(#bars)"/>
    <rect x="108" y="10" width="10" height="60" rx="5" fill="url(#bars)"/>
    <rect x="126" y="38" width="10" height="32" rx="5" fill="url(#bars)"/>
    <rect x="144" y="20" width="10" height="50" rx="5" fill="url(#bars)"/>
    <rect x="162" y="46" width="10" height="24" rx="5" fill="url(#bars)"/>
    <rect x="180" y="6"  width="10" height="64" rx="5" fill="url(#bars)"/>
    <rect x="198" y="30" width="10" height="40" rx="5" fill="url(#bars)"/>
    <rect x="216" y="50" width="10" height="20" rx="5" fill="url(#bars)"/>
    <rect x="234" y="18" width="10" height="52" rx="5" fill="url(#bars)"/>
    <rect x="252" y="40" width="10" height="30" rx="5" fill="url(#bars)"/>
  </g>
</svg>
